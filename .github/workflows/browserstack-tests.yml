name: BrowserStack cross-browser tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Absolute URL of the application under test
        required: true
        default: https://bstackdemo.com
        type: string
      suite:
        description: Test scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - all
      use_local:
        description: Use BrowserStack Local for private or localhost targets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: browserstack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: browserstack
    env:
      APP_BASE_URL: ${{ inputs.target_url }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      TEST_SUITE: ${{ inputs.suite }}
      USE_BROWSERSTACK_LOCAL: ${{ inputs.use_local }}
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify required secrets
        shell: bash
        run: |
          if [[ -z "${BROWSERSTACK_USERNAME}" || -z "${BROWSERSTACK_ACCESS_KEY}" ]]; then
            echo "BrowserStack secrets are not configured for this environment."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Configure BrowserStack build
        run: >-
          npm run config:browserstack --
          --local="${USE_BROWSERSTACK_LOCAL}"
          --project-name="${GITHUB_REPOSITORY}"
          --build-name="GitHub-Actions"
          --build-identifier="${GITHUB_RUN_NUMBER}"

      - name: Run selected test suite
        shell: bash
        run: |
          case "${TEST_SUITE}" in
            smoke) npm run test:browserstack -- --grep @smoke ;;
            regression) npm run test:browserstack -- --grep @regression ;;
            all) npm run test:browserstack ;;
            *) echo "Unsupported suite: ${TEST_SUITE}"; exit 2 ;;
          esac

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-evidence-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
